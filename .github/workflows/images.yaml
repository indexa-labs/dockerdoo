name: Verify and publish Odoo images

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"
  push:
    branches: [main]
    paths:
      - .dockerignore
      - .env.example
      - .github/workflows/**
      - Dockerfile
      - config/**
      - custom/**
      - docker-compose.yml
      - resources/**
      - tests/**
  pull_request:
    paths:
      - .dockerignore
      - .env.example
      - .github/workflows/**
      - Dockerfile
      - config/**
      - custom/**
      - docker-compose.yml
      - resources/**
      - tests/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/indexa-labs/dockerdoo

jobs:
  resolve_odoo_refs:
    name: Resolve the current Odoo 20 commit
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.refs.outputs.matrix }}
      image: ${{ steps.refs.outputs.image }}
    steps:
      - name: Resolve the branch once for this run
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          ref="$(git ls-remote https://github.com/odoo/odoo.git refs/heads/20.0 | cut -f1)"
          if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve Odoo branch 20.0" >&2
            exit 1
          fi
          echo "Resolved Odoo 20.0 to ${ref}" >&2
          matrix="$(jq -cn --arg ref "$ref" '{include:[
            {odoo_version:"20.0",odoo_ref:$ref,platform:"linux/amd64",runner:"ubuntu-latest",arch:"amd64"},
            {odoo_version:"20.0",odoo_ref:$ref,platform:"linux/arm64",runner:"ubuntu-24.04-arm",arch:"arm64"}
          ]}')"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

  build_test_pull_request:
    name: Build and test without registry access
    if: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
    needs: resolve_odoo_refs
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve_odoo_refs.outputs.matrix) }}
    uses: ./.github/workflows/image-builder.yaml
    with:
      odoo_version: ${{ matrix.odoo_version }}
      odoo_ref: ${{ matrix.odoo_ref }}
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      image: ${{ needs.resolve_odoo_refs.outputs.image }}
      stage_tag: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.odoo_version }}-${{ matrix.arch }}
      publish_stage: false

  build_test_main:
    name: Build, test and stage trusted images
    if: ${{ github.repository == 'indexa-labs/dockerdoo' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: resolve_odoo_refs
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve_odoo_refs.outputs.matrix) }}
    uses: ./.github/workflows/image-builder.yaml
    with:
      odoo_version: ${{ matrix.odoo_version }}
      odoo_ref: ${{ matrix.odoo_ref }}
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      image: ${{ needs.resolve_odoo_refs.outputs.image }}
      stage_tag: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.odoo_version }}-${{ matrix.arch }}
      publish_stage: true

  publish_tested_manifest:
    name: Publish the tested Odoo 20 manifest
    if: ${{ github.repository == 'indexa-labs/dockerdoo' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs:
      - build_test_main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      # 20.0 follows the newest tested build. 20.0.YYYYMMDD is valid semver, so platforms
      # that auto-update by semver move between dated builds of the same Odoo series.
      - name: Create the multi-platform manifest from the tested images
        id: manifest
        env:
          STAGE_PREFIX: ci-${{ github.run_id }}-${{ github.run_attempt }}-20.0
        run: |
          set -euo pipefail
          day="$(date -u +%Y%m%d)"
          docker buildx imagetools create \
            --tag "${IMAGE}:20.0" \
            --tag "${IMAGE}:20.0-${day}" \
            --tag "${IMAGE}:20.0.${day}" \
            "${IMAGE}:${STAGE_PREFIX}-amd64" "${IMAGE}:${STAGE_PREFIX}-arm64"
          digest="$(docker buildx imagetools inspect "${IMAGE}:20.0-${day}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Published ${IMAGE}:20.0-${day}@${digest}" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2.3.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
