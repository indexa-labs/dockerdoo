name: Build and test one Odoo image

on:
  workflow_call:
    inputs:
      odoo_version:
        required: true
        type: string
      odoo_ref:
        required: true
        type: string
      platform:
        required: true
        type: string
      runner:
        required: true
        type: string
      stage_tag:
        required: true
        type: string
      publish_stage:
        required: false
        type: boolean
        default: false
      no_cache:
        description: Disable the Docker cache for this build
        required: false
        type: boolean
        default: false

jobs:
  build-test:
    name: Odoo ${{ inputs.odoo_version }} on ${{ inputs.platform }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Run unit tests
        run: python3 -m unittest tests/test_containerlimits.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: type=raw,value=${{ inputs.stage_tag }}
          labels: |
            org.odoo.version=${{ inputs.odoo_version }}
            org.odoo.revision=${{ inputs.odoo_ref }}

      - name: Build local image
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          file: Dockerfile
          target: production
          platforms: ${{ inputs.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ODOO_VERSION=${{ inputs.odoo_version }}
            ODOO_REF=${{ inputs.odoo_ref }}
            PYTHON_VERSION=3.12-slim
            OS_VARIANT=bookworm
          load: true
          no-cache: ${{ inputs.no_cache }}
          cache-from: type=gha,scope=odoo-${{ inputs.odoo_version }}-${{ inputs.platform }}
          cache-to: type=gha,mode=max,scope=odoo-${{ inputs.odoo_version }}-${{ inputs.platform }}

      - name: Run hosted-platform and native Odoo tests
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.stage_tag }}
        run: python3 tests/test_hosted.py --image "$IMAGE" --native-tests

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.publish_stage }}
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push tested platform images
        if: ${{ inputs.publish_stage }}
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.stage_tag }}
        run: docker push "$IMAGE"
