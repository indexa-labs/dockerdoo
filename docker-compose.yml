# Local Odoo 20 with PostgreSQL. Copy .env.example to .env and set the passwords.
services:
  odoo:
    image: ghcr.io/indexa-labs/dockerdoo:20.0
    build:
      context: .
      target: production
      args:
        ODOO_VERSION: "20.0"
    environment:
      PGHOST: db
      PGUSER: odoo
      PGPASSWORD: ${PGPASSWORD:?set PGPASSWORD}
      PGDATABASE: ${PGDATABASE:-odoo}
      DB_ADMIN_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db/postgres
      AUTO_INIT: "1"
      AUTO_UPGRADE: "1"
      INIT_MODULES: ${INIT_MODULES:-}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:?set INIT_ADMIN_PASSWORD}
    ports:
      - 127.0.0.1:8069:8069
    volumes:
      - odoo-data:/var/lib/odoo/data
      - ./custom:/mnt/extra-addons:ro
    depends_on: [db]
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - psql:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  odoo-data:
  psql:
